  Served with status 503 while the application of an instance does not answer
  (update, restart): self-contained, no request to the application or to

  soon as the application answers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Humble Planning</title>
<noscript><meta http-equiv="refresh" content="20"></noscript>
<style>
  :root {
    --bg: #f6f5fb;
    --card: rgba(255, 255, 255, 0.8);
    --border: rgba(109, 59, 255, 0.14);
    --text: #17141f;
    --muted: #5f5a72;
    --track: rgba(109, 59, 255, 0.09);
    --grid: rgba(109, 59, 255, 0.07);
    --glow-a: rgba(109, 59, 255, 0.16);
    --glow-b: rgba(200, 150, 255, 0.24);
    --violet: #6d3bff;
    --violet-soft: rgba(109, 59, 255, 0.1);
    --shadow: 0 30px 80px -32px rgba(76, 29, 149, 0.35);
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background:
      radial-gradient(40rem 28rem at 12% 8%, var(--glow-a), transparent 70%),
      radial-gradient(36rem 26rem at 90% 92%, var(--glow-b), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* The planning grid, fading out towards the edges */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    pointer-events: none;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 40px 36px 32px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
  }
  .logo { display: block; width: 188px; height: auto; margin: 0 auto 28px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--violet-soft);
    color: var(--violet);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  h1 { margin-top: 16px; font-size: 22px; line-height: 1.3; font-weight: 650; letter-spacing: -0.01em; }
  .lead { margin-top: 10px; color: var(--muted); }
  /* Tasks being scheduled again */
  .board { display: grid; gap: 9px; margin: 28px 4px 26px; }
  .track { position: relative; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #5a1fff, #9b6bff 60%, #d29cff);
    transform-origin: left center;
    animation: plan 3.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  .track:nth-child(1) .bar { left: 6%; width: 46%; }
  .track:nth-child(2) .bar { left: 30%; width: 52%; animation-delay: 0.35s; }
  .track:nth-child(3) .bar { left: 14%; width: 30%; animation-delay: 0.7s; }
  .status {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--violet);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--violet-soft); }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .thanks { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  @keyframes plan {
    0% { transform: scaleX(0); opacity: 1; }
    45%, 70% { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .bar, .dot { animation: none; }
  }
  @media (max-width: 420px) {
    main { padding: 32px 22px 26px; border-radius: 20px; }
    h1 { font-size: 20px; }
  }
</style>
</head>

<script>
  (function () {
    var TEXTS = {
      en: { badge: "Maintenance", title: "Your planning will be back in a moment", lead: "An update or a restart is in progress. This page will reload on its own as soon as everything is ready.", next: "Checking again in {s} s", checking: "Checking…", retry: "Try again now", thanks: "Thank you for your patience." },
      fr: { badge: "Maintenance", title: "Le planning revient dans un instant", lead: "Une mise à jour ou un redémarrage est en cours. Cette page se rechargera d'elle-même dès que tout sera prêt.", next: "Nouvelle vérification dans {s} s", checking: "Vérification…", retry: "Réessayer maintenant", thanks: "Merci de votre patience." },
      es: { badge: "Mantenimiento", title: "La planificación vuelve en un momento", lead: "Hay una actualización o un reinicio en curso. Esta página se recargará sola en cuanto todo esté listo.", next: "Nueva comprobación en {s} s", checking: "Comprobando…", retry: "Reintentar ahora", thanks: "Gracias por su paciencia." },
      de: { badge: "Wartung", title: "Die Planung ist gleich wieder da", lead: "Ein Update oder ein Neustart läuft. Diese Seite lädt automatisch neu, sobald alles bereit ist.", next: "Nächste Prüfung in {s} s", checking: "Wird geprüft …", retry: "Jetzt erneut versuchen", thanks: "Vielen Dank für Ihre Geduld." }
    };
    var langs = navigator.languages || [navigator.language || "en"];
    var lang = "en";
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i]).slice(0, 2).toLowerCase();
      if (TEXTS[code]) { lang = code; break; }
    }
    var t = TEXTS[lang];
    document.documentElement.lang = lang;
    var nodes = document.querySelectorAll("[data-t]");
    for (var j = 0; j < nodes.length; j++) nodes[j].textContent = t[nodes[j].getAttribute("data-t")];

    // The application is back when the page no longer answers 502/503/504.
    var DELAY = 5, left = DELAY, busy = false;
    var status = document.getElementById("status");
    function show() { status.textContent = busy ? t.checking : t.next.replace("{s}", left); }
    function check() {
      if (busy) return;
      busy = true; show();
      fetch(location.href, { method: "HEAD", cache: "no-store", redirect: "manual", credentials: "same-origin" })
        .then(function (r) {
          if (r.type === "opaqueredirect" || [502, 503, 504].indexOf(r.status) < 0) { location.reload(); return; }
          throw new Error("down");
        })
        .catch(function () { busy = false; left = DELAY; show(); });
    }
    document.getElementById("retry").addEventListener("click", check);
    setInterval(function () { if (busy) return; left -= 1; if (left <= 0) check(); else show(); }, 1000);
    show();
  })();
</script>
</body>
</html>
