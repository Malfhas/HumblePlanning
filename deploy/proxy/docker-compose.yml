# Humble Planning — shared reverse proxy (Caddy) of the instances on this
# server, managed by install.sh and the `humble-planning` command.
#
# Settings live in the .env file next to this file (COMPOSE_PROJECT_NAME
# "humbleplanning-proxy", image, version, public ports). The configuration is
# in ./caddy, mounted at /etc/caddy/humble:
#   Caddyfile        global options, generated by `humble-planning`
#   sites/<name>.caddy   one site per instance (generated once, then kept:
#                        changes made there survive the updates)
#   secrets/<name>.cloudflare-token   API token of a site using the Cloudflare
#                        DNS challenge (mode 600), read with {file.…}
# After a manual change: `humble-planning proxy reload` (checked first, the
# running configuration is kept when it is invalid).
# The image version follows the newest version installed on this server
# (`humble-planning update` moves it forward, never back).

services:
  caddy:
    image: ${HUMBLE_CADDY_IMAGE:-ghcr.io/malfhas/humble-planning-caddy}:${HUMBLE_CADDY_VERSION:?HUMBLE_CADDY_VERSION must be set in .env}
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/humble/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${HP_HTTP_PORT:-80}:80"
      - "${HP_HTTPS_PORT:-443}:443"
      - "${HP_HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./caddy:/etc/caddy/humble:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    networks: [proxy]

networks:
  proxy:
    # Shared with the instances (docker-compose.proxy.yml), created by install.sh.
    name: humbleplanning-proxy
    external: true

volumes:
  caddy_data: {}
  caddy_config: {}
