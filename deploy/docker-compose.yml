# Humble Planning — stack of one instance (managed by install.sh).
#
# Every setting lives in the .env file next to this file: it is read by
# Compose for the ${…} variables below and passed to the app containers.
# Optional services are enabled with COMPOSE_PROFILES in .env:
#   db      built-in PostgreSQL container (omit it to use an external server)
#           POSTGRES_* create its superuser, which never leaves this container;
#           the application connects with DATABASE_URL as a dedicated user
#           that owns the database but is not a superuser (set up by install.sh)
#
# Several instances can run on one server, each in its own directory with its
# own Compose project (COMPOSE_PROJECT_NAME in .env: "humbleplanning-<name>",
# "humbleplanning" for an installation made with 1.0.x). An instance served by
# the shared reverse proxy (Caddy, in <base dir>/proxy) also uses
# docker-compose.proxy.yml, listed in COMPOSE_FILE in .env: run Compose from
# this directory.
# Day-to-day management: the `humble-planning` command (list, status, logs,
# update, rollback, backup, remove…), which runs Docker Compose in this
# directory.

x-app: &app
  # The installed version (HUMBLE_VERSION) is managed by `humble-planning update`.
  image: ${HUMBLE_IMAGE:-ghcr.io/malfhas/humble-planning}:${HUMBLE_VERSION:?HUMBLE_VERSION must be set in .env}
  restart: unless-stopped
  init: true
  env_file: .env
  volumes:
    - uploads:/app/uploads
    - data:/app/data
  networks: [backend]
  extra_hosts:
    # Lets an external database running on the Docker host be reached as
    # host.docker.internal.
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
      required: false # the db service is disabled with an external database

services:
  app:
    <<: *app
    command: ["web"]
    environment:
      # socket.internal only exists on this instance's backend network. On the
      # network shared with the reverse proxy, "socket" also names the Socket.io
      # servers of the other instances.
      SOCKET_URL: http://socket.internal:3001
      # Secrets of the other services, blanked: the application never gets them.
      CLOUDFLARE_API_TOKEN: "" # only the reverse proxy needs one
      POSTGRES_PASSWORD: "" # PostgreSQL superuser, db container only
    ports:
      # Loopback only: reached through the reverse proxy.
      - "127.0.0.1:${HP_APP_PORT:-3000}:3000"

  socket:
    <<: *app
    command: ["socket"]
    networks:
      backend:
        aliases: [socket.internal]
    environment:
      CLOUDFLARE_API_TOKEN: ""
      POSTGRES_PASSWORD: ""
    ports:
      - "127.0.0.1:${HP_SOCKET_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "docker-entrypoint.sh", "healthcheck", "socket"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  db:
    image: postgres:18-alpine
    profiles: [db]
    restart: unless-stopped
    environment:
      # Superuser created on the first start (empty volume). Installations
      # made before v1.0.0 use it as the application user too.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-humble_planning}
    volumes:
      # PostgreSQL 18+ keeps its data in /var/lib/postgresql/<major>/docker:
      # mount the parent directory so that future major upgrades fit in.
      - db_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

networks:
  backend: {}

volumes:
  db_data: {}
  uploads: {}
  data: {}
