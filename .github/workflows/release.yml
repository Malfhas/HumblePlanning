name: Release

# Builds and publishes the Docker images on GHCR for every v* tag:
#   ghcr.io/<owner>/humble-planning         application (web, Socket.io, provisioning)
#   ghcr.io/<owner>/humble-planning-caddy   Caddy with the Cloudflare DNS module
# Tags: <version> (e.g. 1.2.3) and latest (not for pre-releases such as 1.2.3-rc.1).
# Platforms: linux/amd64 and linux/arm64. The Dockerfiles build the
# platform-independent parts (Next.js, Go cross-compilation) on the runner's
# native platform, so QEMU only runs the dependency installation for arm64.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: humble-planning
            context: .
            file: ./Dockerfile
          - name: humble-planning-caddy
            context: ./deploy/caddy
            file: ./deploy/caddy/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME%%-*}" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Image name
        id: image
        # GHCR repository names must be lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: type=semver,pattern={{version}}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
