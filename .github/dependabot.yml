# Weekly dependency updates, grouped to keep the number of pull requests low.
# Security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # Major upgrades with breaking changes, planned separately
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: drizzle-orm
        update-types: ["version-update:semver-major"]
      - dependency-name: drizzle-kit
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /deploy/caddy]
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
